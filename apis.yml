aid: brisk-teaching
name: Brisk Teaching
description: >-
  Brisk Teaching is a K-12 education technology company that integrates AI
  directly into the tools teachers already use. Its platform spans three
  connected products: the Brisk Extension (which brings AI into Google Docs,
  Slides, PDFs, and YouTube), Brisk Boost (a safe, teacher-controlled,
  student-facing AI workspace), and Brisk Next (a web-based planning and
  instruction hub). Brisk helps educators give feedback, create instructional
  materials, change reading levels, inspect student writing, and generate
  presentations, lesson plans, rubrics, quizzes, IEP goals, and math problems.
  The company is backed by Bessemer Venture Partners. Brisk publishes an
  llms.txt for AI representation and a public status page, but does not
  currently expose a public developer API, SDKs, or API documentation. This
  API Evangelist profile tracks its public surface.
